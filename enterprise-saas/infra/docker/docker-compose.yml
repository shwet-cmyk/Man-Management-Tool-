version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: enterprise_saas
    ports: ["5432:5432"]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  api:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run start:dev"
    volumes:
      - ../../apps/api:/app
    ports: ["3000:3000"]
    depends_on: [postgres, redis]
