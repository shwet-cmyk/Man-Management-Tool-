services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: tez-mssql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./backend/app/db/mssql_schema.sql:/docker-entrypoint-initdb.d/mssql_schema.sql:ro
      - ./backend/app/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "localhost", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD}", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  mssql-init:
    image: mcr.microsoft.com/mssql-tools
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./backend/app/db/mssql_schema.sql:/tmp/mssql_schema.sql:ro
      - ./backend/app/db/init.sql:/tmp/init.sql:ro
    entrypoint: ["/bin/bash", "-lc", "/opt/mssql-tools/bin/sqlcmd -S mssql -U sa -P ${MSSQL_SA_PASSWORD} -d master -i /tmp/mssql_schema.sql && /opt/mssql-tools/bin/sqlcmd -S mssql -U sa -P ${MSSQL_SA_PASSWORD} -d master -i /tmp/init.sql"]

  redis:
    image: redis:7-alpine
    container_name: tez-redis
    ports:
      - "6379:6379"

  backend-api:
    build:
      context: .
      dockerfile: devops/docker/backend.Dockerfile
    container_name: tez-backend
    env_file: .env
    environment:
      PYTHONPATH: /app/backend
      REDIS_URL: ${REDIS_URL}
      DB_CONNECTION: ${DB_CONNECTION}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./backend:/app/backend
    depends_on:
      - redis
      - mssql-init
    ports:
      - "8000:8000"

  websocket-service:
    build:
      context: .
      dockerfile: devops/docker/websocket.Dockerfile
    env_file: .env
    environment:
      REDIS_URL: ${REDIS_URL}
      WS_JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./websocket-service:/app/websocket-service
    depends_on:
      - redis
    ports:
      - "8010:8010"

  worker-service:
    build:
      context: .
      dockerfile: devops/docker/worker.Dockerfile
    env_file: .env
    environment:
      PYTHONPATH: /app/backend
      REDIS_URL: ${REDIS_URL}
    volumes:
      - ./backend:/app/backend
    depends_on:
      - redis

  frontend:
    build:
      context: .
      dockerfile: devops/docker/frontend.Dockerfile
    env_file: .env
    environment:
      VITE_API_BASE_URL: ${API_BASE_URL}
      VITE_WS_URL: ${WS_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend-api
      - frontend
      - websocket-service
    ports:
      - "8080:80"
    volumes:
      - ./devops/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mssql_data:
